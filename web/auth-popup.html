<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sign in — FurSnips</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0FDF9;color:#134E4A;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
    .card{background:#FFFFFF;border-radius:20px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(15,118,110,0.10)}
    h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;color:#134E4A}
    .subtitle{color:#6B8A83;font-size:13px;text-align:center;margin-bottom:24px}
    .tabs{display:flex;border-bottom:1px solid #CCFBF1;margin-bottom:20px}
    .tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;color:#6B8A83;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
    .tab.active{color:#0F766E;border-bottom-color:#0F766E}
    .panel{display:none}.panel.active{display:block}
    input{width:100%;padding:13px 14px;background:#F3FBF8;border:1px solid #CCFBF1;border-radius:10px;color:#134E4A;font-size:15px;margin-bottom:10px;outline:none;transition:border-color .2s}
    input:focus{border-color:#0F766E}
    input::placeholder{color:#6B8A83}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;transition:opacity .15s}
    .btn:hover{opacity:.88}
    .btn-primary{background:#0F766E;color:#fff}
    .btn-fb{background:#1877F2;color:#fff}
    .btn-google{background:#fff;color:#3c4043;border:1px solid #dadce0}
    .divider{display:flex;align-items:center;gap:10px;margin:14px 0}
    .divider-line{flex:1;height:1px;background:#CCFBF1}
    .divider-text{color:#6B8A83;font-size:12px}
    .status{color:#ef4444;font-size:13px;text-align:center;margin-top:8px;min-height:20px}
    .status.ok{color:#0F766E}
    .spinner{display:none;margin:12px auto;width:26px;height:26px;border:3px solid #CCFBF1;border-top-color:#0F766E;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .terms{font-size:11px;color:#6B8A83;text-align:center;margin-top:14px;line-height:1.6}
  </style>
  <script>
    var STRAPI='https://auth.alphinium.io';
    window.fbAsyncInit=function(){FB.init({appId:'1278485494007756',cookie:true,xfbml:true,version:'v25.0'});};
    (function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(d.getElementById(id))return;js=d.createElement(s);js.id=id;js.src='https://connect.facebook.net/en_US/sdk.js';fjs.parentNode.insertBefore(js,fjs)}(document,'script','facebook-jssdk'));
    function setStatus(msg,ok){var el=document.getElementById('status');el.textContent=msg;el.className='status'+(ok?' ok':'');}
    function setSpinner(on){document.getElementById('spinner').style.display=on?'block':'none'}
    function sendResult(data){
      if(window.opener){window.opener.postMessage({type:'alphinium-auth',jwt:data.jwt,user:data.user},'*');window.close();}
      else{window.location.href=window.location.origin+'?alphinium_jwt='+encodeURIComponent(data.jwt);}
    }
    function switchTab(tab){
      document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});
      document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id==='panel-'+tab)});
      setStatus('');
    }
    function loginFacebook(){
      setSpinner(true);setStatus('');
      FB.login(function(r){
        if(r.authResponse&&r.authResponse.accessToken){
          setStatus('Signing you in…');
          fetch(STRAPI+'/api/auth/facebook/callback?access_token='+r.authResponse.accessToken)
            .then(function(res){return res.json()})
            .then(function(data){
              if(data.jwt){sendResult(data);}
              else{setSpinner(false);setStatus((data.error&&data.error.message)||'Login failed.');}
            }).catch(function(){setSpinner(false);setStatus('Network error. Try again.');});
        }else{setSpinner(false);if(r.status!=='unknown')setStatus('Login cancelled.');}
      },{scope:'email,public_profile'});
    }
    function loginGoogle(){
      setSpinner(true);setStatus('');
      var redirect=encodeURIComponent(window.location.href+'?provider=google');
      window.location.href=STRAPI+'/api/connect/google?redirect='+redirect;
    }
    function doLogin(e){
      e.preventDefault();
      var id=document.getElementById('login-email').value.trim();
      var pw=document.getElementById('login-password').value;
      if(!id||!pw){setStatus('Please enter your email and password.');return;}
      setSpinner(true);setStatus('');
      fetch(STRAPI+'/api/auth/local',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({identifier:id,password:pw})
      }).then(function(r){return r.json()}).then(function(data){
        setSpinner(false);
        if(data.jwt){sendResult(data);}
        else{setStatus((data.error&&data.error.message)||'Invalid email or password.');}
      }).catch(function(){setSpinner(false);setStatus('Network error. Try again.');});
    }
    function doSignup(e){
      e.preventDefault();
      var name=document.getElementById('signup-name').value.trim();
      var email=document.getElementById('signup-email').value.trim();
      var pw=document.getElementById('signup-password').value;
      var pw2=document.getElementById('signup-password2').value;
      if(!name||!email||!pw){setStatus('Please fill in all fields.');return;}
      if(pw!==pw2){setStatus('Passwords do not match.');return;}
      if(pw.length<8){setStatus('Password must be at least 8 characters.');return;}
      setSpinner(true);setStatus('');
      fetch(STRAPI+'/api/auth/local/register',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:name,email:email,password:pw})
      }).then(function(r){return r.json()}).then(function(data){
        setSpinner(false);
        if(data.jwt){sendResult(data);}
        else{setStatus((data.error&&data.error.message)||'Registration failed. Try a different email.');}
      }).catch(function(){setSpinner(false);setStatus('Network error. Try again.');});
    }
    window.onload=function(){
      var params=new URLSearchParams(window.location.search);
      var provider=params.get('provider');
      var access_token=params.get('access_token');
      if(provider==='google'&&access_token){
        setSpinner(true);setStatus('Completing sign in…');
        fetch(STRAPI+'/api/auth/google/callback?access_token='+access_token)
          .then(function(r){return r.json()}).then(function(data){
            setSpinner(false);
            if(data.jwt){sendResult(data);}
            else{setStatus((data.error&&data.error.message)||'Login failed.');}
          }).catch(function(){setSpinner(false);setStatus('Network error. Try again.');});
      }
    }
  </script>
</head><body>
  <div class="card">
    <h1>✂️ FurSnips</h1>
    <p class="subtitle">Create an account or sign in</p>
    <div id="spinner" class="spinner"></div>
    <div class="tabs">
      <div class="tab active" data-tab="login" onclick="switchTab('login')">Sign In</div>
      <div class="tab" data-tab="signup" onclick="switchTab('signup')">Create Account</div>
    </div>
    <div id="panel-login" class="panel active">
      <form onsubmit="doLogin(event)">
        <input id="login-email" type="email" placeholder="Email address" autocomplete="email" required/>
        <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required/>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>
      <div class="divider"><div class="divider-line"></div><span class="divider-text">or continue with</span><div class="divider-line"></div></div>
      <button class="btn btn-fb" onclick="loginFacebook()"><span>📘</span> Facebook</button>
      <button class="btn btn-google" onclick="loginGoogle()"><span>🔵</span> Google</button>
    </div>
    <div id="panel-signup" class="panel">
      <form onsubmit="doSignup(event)">
        <input id="signup-name" type="text" placeholder="Display name" autocomplete="name" required/>
        <input id="signup-email" type="email" placeholder="Email address" autocomplete="email" required/>
        <input id="signup-password" type="password" placeholder="Password (min 8 chars)" autocomplete="new-password" required/>
        <input id="signup-password2" type="password" placeholder="Confirm password" autocomplete="new-password" required/>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
      <div class="divider"><div class="divider-line"></div><span class="divider-text">or sign up with</span><div class="divider-line"></div></div>
      <button class="btn btn-fb" onclick="loginFacebook()"><span>📘</span> Facebook</button>
      <button class="btn btn-google" onclick="loginGoogle()"><span>🔵</span> Google</button>
    </div>
    <p id="status" class="status"></p>
    <p class="terms">By signing in you agree to our Terms of Service and Privacy Policy</p>
  </div>
</body></html>
